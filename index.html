<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淼淼小档案</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Zhi+Mang+Xing&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

  :root{
    --paper: #f6f0e4;
    --paper-deep: #efe5d2;
    --ink: #2e2a24;
    --ink-soft: #6b6256;
    --plum: #8a3b46;
    --plum-deep: #6c2c36;
    --gold: #b08a3e;
    --sage: #5f7a5e;
    --line: #d8c9a8;
    --card: #fffdf8;
    --danger: #a8473f;
    --danger-bg: #f6e3df;
    --shadow: rgba(60, 45, 20, 0.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(176,138,62,0.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(138,59,70,0.05), transparent 40%);
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 16px 80px;
  }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
  }

  /* ---------- Sync status bar ---------- */
  .sync-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:12px;
    color: var(--ink-soft);
    margin-bottom: 18px;
    padding: 6px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    max-width: fit-content;
    margin-left:auto;
    margin-right:auto;
  }
  .sync-dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--sage);
    flex-shrink:0;
  }
  .sync-dot.syncing{ background: var(--gold); animation: pulse 1s infinite; }
  .sync-dot.error{ background: var(--danger); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    margin-bottom: 36px;
    position: relative;
  }
  .seal{
    display:inline-block;
    font-family:'Zhi Mang Xing', cursive;
    font-size: 15px;
    color: var(--plum);
    border: 1.5px solid var(--plum);
    border-radius: 4px;
    padding: 2px 8px;
    transform: rotate(-4deg);
    margin-bottom: 10px;
    opacity:0.85;
  }
  h1{
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size: clamp(32px, 6vw, 46px);
    margin: 0;
    letter-spacing: 0.08em;
    color: var(--ink);
  }
  h1 span{
    color: var(--plum);
  }
  .subtitle{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 8px;
    letter-spacing: 0.15em;
  }
  .dates-row{
    display:flex;
    justify-content:center;
    gap: 14px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .date-chip{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    box-shadow: 0 2px 6px var(--shadow);
  }
  .date-chip b{ color: var(--plum); font-weight:600; }

  /* ---------- Section layout ---------- */
  .section{
    margin-bottom: 28px;
  }
  .section-head{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-head .icon{
    font-size: 18px;
    width: 34px; height:34px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--card);
    border: 1px solid var(--line);
    flex-shrink:0;
  }
  .section-head h2{
    font-family:'Noto Serif SC', serif;
    font-size: 18px;
    font-weight:600;
    margin:0;
    color: var(--ink);
  }
  .section-head .count{
    font-size:12px;
    color: var(--ink-soft);
    background: var(--paper-deep);
    border-radius:999px;
    padding: 2px 9px;
  }
  .section-head .add-btn{
    margin-left:auto;
    border:1px dashed var(--gold);
    background: transparent;
    color: var(--gold);
    font-size:12px;
    border-radius: 999px;
    padding: 5px 12px;
    cursor:pointer;
    transition: all .15s ease;
    font-family:'Noto Sans SC', sans-serif;
  }
  .section-head .add-btn:hover{
    background: var(--gold);
    color: #fff;
  }

  .card-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }

  .item-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    position: relative;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .item-card:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 16px var(--shadow);
  }
  .item-card .item-text{
    font-size: 14px;
    line-height: 1.55;
    padding-right: 46px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .item-card .item-actions{
    position:absolute;
    top:10px; right:10px;
    display:flex;
    gap: 6px;
  }
  .item-card .ic-btn{
    width: 22px; height:22px;
    border:none;
    background: transparent;
    color: var(--ink-soft);
    cursor:pointer;
    font-size: 13px;
    border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease;
  }
  .item-card .ic-btn:hover{ background: var(--paper-deep); }
  .item-card .ic-btn.del:hover{ color: var(--danger); background: var(--danger-bg); }
  .item-card .ic-btn.edit:hover{ color: var(--gold); }

  .item-card textarea.edit-input{
    width:100%;
    font-family:'Noto Sans SC', sans-serif;
    font-size:14px;
    line-height:1.5;
    border:1px solid var(--gold);
    border-radius:6px;
    padding:6px 8px;
    resize:vertical;
    min-height:50px;
    background:#fffef9;
  }
  .item-card .edit-confirm{
    display:flex; gap:6px; margin-top:6px;
  }
  .item-card .edit-confirm button{
    font-size:12px;
    border:none;
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    font-family:'Noto Sans SC', sans-serif;
  }
  .save-btn{ background: var(--sage); color:#fff; }
  .cancel-btn{ background: var(--paper-deep); color: var(--ink-soft); }

  /* like type variant */
  .item-card.like{ border-left: 3px solid var(--sage); }
  .item-card.dislike{ border-left: 3px solid var(--danger); background: linear-gradient(to right, var(--danger-bg) 0%, var(--card) 14%); }
  .item-card.neutral{ border-left: 3px solid var(--gold); }

  .empty-hint{
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    padding: 10px 4px;
  }

  /* add form */
  .add-form{
    display:none;
    margin-top: 10px;
    background: var(--paper-deep);
    border-radius: 10px;
    padding: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .add-form.open{ display:flex; }
  .add-form textarea{
    flex:1;
    min-width: 200px;
    font-family:'Noto Sans SC', sans-serif;
    font-size:14px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    resize:vertical;
    min-height: 40px;
    background:#fffef9;
  }
  .add-form button{
    border:none;
    border-radius:6px;
    padding:0 16px;
    cursor:pointer;
    background: var(--plum);
    color:#fff;
    font-family:'Noto Sans SC', sans-serif;
    font-size:13px;
  }
  .add-form button:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  /* dislike section special bg */
  .danger-zone{
    border: 1px solid #e3c2bc;
    background: linear-gradient(135deg, #fbf3f1, #f6f0e4 60%);
    border-radius: 14px;
    padding: 16px;
  }

  /* sticky note style for misc */
  .note-card{
    background: #fff9e0;
    border: 1px solid #e8dca0;
    transform: rotate(var(--rot, 0deg));
  }

  footer{
    text-align:center;
    margin-top: 50px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }
  footer .brush{
    font-family:'Zhi Mang Xing', cursive;
    font-size: 16px;
    color: var(--plum);
    display:block;
    margin-bottom:4px;
  }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff8ec;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events:none;
    transition: all .25s ease;
    z-index: 100;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error{ background: var(--danger); }

  @media (max-width: 480px){
    .card-grid{ grid-template-columns: 1fr; }
    h1{ letter-spacing: 0.04em; }
  }

  /* ---------- 密码锁屏 ---------- */
  #lockScreen{
    position: fixed;
    inset: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(176,138,62,0.08), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(138,59,70,0.07), transparent 45%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 24px;
  }
  #lockScreen .lock-box{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 36px 36px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 8px 32px var(--shadow);
    text-align: center;
  }
  #lockScreen .lock-icon{
    font-size: 36px;
    margin-bottom: 12px;
  }
  #lockScreen h2{
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    margin: 0 0 6px;
    color: var(--ink);
  }
  #lockScreen p{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 24px;
  }
  #lockScreen input{
    width: 100%;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 18px;
    text-align: center;
    letter-spacing: 0.3em;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
  }
  #lockScreen input:focus{ border-color: var(--plum); }
  #lockScreen input.shake{
    animation: shake .4s ease;
    border-color: var(--danger);
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-5px); }
    80%{ transform: translateX(5px); }
  }
  #lockScreen button{
    margin-top: 16px;
    width: 100%;
    background: var(--plum);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer;
    transition: background .15s;
  }
  #lockScreen button:hover{ background: var(--plum-deep); }
  #lockScreen .err-hint{
    margin-top: 10px;
    font-size: 12px;
    color: var(--danger);
    min-height: 18px;
  }
  #lockScreen .seal-lock{
    display: inline-block;
    font-family: 'Zhi Mang Xing', cursive;
    font-size: 13px;
    color: var(--plum);
    border: 1px solid var(--plum);
    border-radius: 4px;
    padding: 1px 7px;
    opacity: 0.7;
    margin-bottom: 18px;
    transform: rotate(-3deg);
  }
  body.locked{ overflow: hidden; }
</style>
</head>
<body class="locked">

<!-- 密码锁屏 -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="seal-lock">私藏 · 加密</div>
    <div class="lock-icon">🔒</div>
    <h2>淼淼小档案</h2>
    <p>请输入安全码后查看</p>
    <input type="password" id="lockInput" placeholder="输入安全码" maxlength="20"
      onkeydown="if(event.key==='Enter') checkPassword()" />
    <button onclick="checkPassword()">进入</button>
    <div class="err-hint" id="errHint"></div>
  </div>
</div>

<div class="wrap" id="mainContent" style="display:none">

  <div class="sync-bar" id="syncBar">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText">已连接云端</span>
  </div>

  <header>
    <div class="seal">私藏 · 备忘</div>
    <h1>淼<span>淼</span>小档案</h1>
    <div class="subtitle">悄悄记下，慢慢靠近</div>
    <div class="dates-row" id="birthdayRow">
      <div class="date-chip">🎂 <b>阳历 6.15</b></div>
      <div class="date-chip">🌙 <b>农历 5.2</b></div>
    </div>
  </header>

  <!-- 喜欢 -->
  <div class="section">
    <div class="section-head">
      <div class="icon">💚</div>
      <h2>她喜欢的</h2>
      <span class="count" id="count-like">0</span>
      <button class="add-btn" onclick="toggleForm('like')">+ 添加</button>
    </div>
    <div class="add-form" id="form-like">
      <textarea id="input-like" placeholder="例如：喜欢吃小龙虾"></textarea>
      <button onclick="addItem('like')">保存</button>
    </div>
    <div class="card-grid" id="list-like"></div>
  </div>

  <!-- 雷点 / 不喜欢 -->
  <div class="section">
    <div class="section-head">
      <div class="icon">⚠️</div>
      <h2>雷点 · 不喜欢</h2>
      <span class="count" id="count-dislike">0</span>
      <button class="add-btn" onclick="toggleForm('dislike')">+ 添加</button>
    </div>
    <div class="add-form" id="form-dislike">
      <textarea id="input-dislike" placeholder="例如：不喜欢烟味"></textarea>
      <button onclick="addItem('dislike')">保存</button>
    </div>
    <div class="danger-zone">
      <div class="card-grid" id="list-dislike"></div>
    </div>
  </div>

  <!-- 宠物 -->
  <div class="section">
    <div class="section-head">
      <div class="icon">🐱</div>
      <h2>家里的小猫</h2>
      <span class="count" id="count-pet">0</span>
      <button class="add-btn" onclick="toggleForm('pet')">+ 添加</button>
    </div>
    <div class="add-form" id="form-pet">
      <textarea id="input-pet" placeholder="例如：蓝猫(12岁)：李灰灰"></textarea>
      <button onclick="addItem('pet')">保存</button>
    </div>
    <div class="card-grid" id="list-pet"></div>
  </div>

  <!-- 行程 / 计划 -->
  <div class="section">
    <div class="section-head">
      <div class="icon">📍</div>
      <h2>行程 · 计划</h2>
      <span class="count" id="count-plan">0</span>
      <button class="add-btn" onclick="toggleForm('plan')">+ 添加</button>
    </div>
    <div class="add-form" id="form-plan">
      <textarea id="input-plan" placeholder="例如：6.23号去徐州"></textarea>
      <button onclick="addItem('plan')">保存</button>
    </div>
    <div class="card-grid" id="list-plan"></div>
  </div>

  <!-- 去过的地方 -->
  <div class="section">
    <div class="section-head">
      <div class="icon">🗺️</div>
      <h2>去过的地方</h2>
      <span class="count" id="count-places">0</span>
      <button class="add-btn" onclick="toggleForm('places')">+ 添加</button>
    </div>
    <div class="add-form" id="form-places">
      <textarea id="input-places" placeholder="例如：黑龙江"></textarea>
      <button onclick="addItem('places')">保存</button>
    </div>
    <div class="card-grid" id="list-places"></div>
  </div>

  <!-- 其他备忘 -->
  <div class="section">
    <div class="section-head">
      <div class="icon">📝</div>
      <h2>其他小事</h2>
      <span class="count" id="count-misc">0</span>
      <button class="add-btn" onclick="toggleForm('misc')">+ 添加</button>
    </div>
    <div class="add-form" id="form-misc">
      <textarea id="input-misc" placeholder="例如：6.17耳机坏了(应该是蓝牙耳机)"></textarea>
      <button onclick="addItem('misc')">保存</button>
    </div>
    <div class="card-grid" id="list-misc"></div>
  </div>

  <footer>
    <span class="brush">愿你被温柔以待</span>
    数据已同步到云端，换设备打开同一个文件即可看到最新内容
  </footer>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 密码保护 ============ */
// ★ 在这里修改你的安全码 ★
const PASSWORD = '0615';
const SESSION_KEY = 'mm_unlocked';

function checkPassword(){
  const input = document.getElementById('lockInput');
  const hint  = document.getElementById('errHint');
  if(input.value === PASSWORD){
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = '';
    document.body.classList.remove('locked');
    fetchAll();
  } else {
    hint.textContent = '安全码不正确，请重试';
    input.classList.add('shake');
    input.value = '';
    setTimeout(() => input.classList.remove('shake'), 500);
  }
}

// 本次会话已解锁则直接跳过锁屏
if(sessionStorage.getItem(SESSION_KEY) === '1'){
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = '';
    document.body.classList.remove('locked');
    fetchAll();
  });
}

/* ============ Supabase 连接配置 ============ */
const SUPABASE_URL = 'https://vlbdguleovswmchypadd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OEL6dIn9SIE1efzGPP99qA_qGD2nE_9';
const TABLE = 'miaomiao_profile_records';

const REST_URL = `${SUPABASE_URL}/rest/v1/${TABLE}`;
const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

const CATEGORIES = ['like', 'dislike', 'pet', 'plan', 'places', 'misc'];
const CATEGORY_CLASS = {
  like: 'like',
  dislike: 'dislike',
  pet: 'neutral',
  plan: 'neutral',
  places: 'neutral',
  misc: 'note-card'
};

// 本地数据缓存： { like: [{id, content}], dislike: [...], ... }
let data = {};
CATEGORIES.forEach(c => data[c] = []);

let isOnline = true;

/* ============ 工具函数 ============ */
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg, isError=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 2200);
}

function setSyncStatus(state, text){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncText');
  dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
  label.textContent = text;
}

/* ============ 远程数据读写 ============ */
async function fetchAll(){
  setSyncStatus('syncing', '正在同步...');
  try{
    const res = await fetch(`${REST_URL}?select=*&order=sort_order.asc,id.asc`, {
      headers: HEADERS
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();

    CATEGORIES.forEach(c => data[c] = []);
    rows.forEach(row => {
      if(!data[row.category]) data[row.category] = [];
      data[row.category].push({ id: row.id, content: row.content });
    });

    isOnline = true;
    setSyncStatus('ok', '已同步云端');
    renderAll();
  }catch(err){
    console.error('fetch failed', err);
    isOnline = false;
    setSyncStatus('error', '同步失败，检查网络');
    showToast('无法连接云端数据库，请检查网络后刷新', true);
  }
}

async function remoteAdd(category, content){
  const res = await fetch(REST_URL, {
    method: 'POST',
    headers: { ...HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify({ category, content, sort_order: Date.now() % 2000000000 })
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const rows = await res.json();
  return rows[0];
}

async function remoteUpdate(id, content){
  const res = await fetch(`${REST_URL}?id=eq.${id}`, {
    method: 'PATCH',
    headers: HEADERS,
    body: JSON.stringify({ content })
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
}

async function remoteDelete(id){
  const res = await fetch(`${REST_URL}?id=eq.${id}`, {
    method: 'DELETE',
    headers: HEADERS
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
}

/* ============ 渲染 ============ */
function render(category){
  const listEl = document.getElementById('list-' + category);
  const countEl = document.getElementById('count-' + category);
  const items = data[category] || [];
  countEl.textContent = items.length;

  if(items.length === 0){
    listEl.innerHTML = '<div class="empty-hint">还没有记录，点击上方"+ 添加"试试</div>';
    return;
  }

  listEl.innerHTML = items.map((item, idx) => {
    const cls = CATEGORY_CLASS[category] || '';
    const rot = category === 'misc' ? (idx % 2 === 0 ? '-0.6deg' : '0.6deg') : '0deg';
    return `
      <div class="item-card ${cls}" style="--rot:${rot}" data-cat="${category}" data-id="${item.id}">
        <div class="item-text" id="text-${category}-${item.id}">${escapeHtml(item.content)}</div>
        <div class="item-actions">
          <button class="ic-btn edit" title="编辑" onclick="startEdit('${category}', ${item.id})">✎</button>
          <button class="ic-btn del" title="删除" onclick="deleteItem('${category}', ${item.id})">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderAll(){
  CATEGORIES.forEach(render);
}

/* ============ 交互 ============ */
function toggleForm(category){
  const form = document.getElementById('form-' + category);
  form.classList.toggle('open');
  if(form.classList.contains('open')){
    document.getElementById('input-' + category).focus();
  }
}

async function addItem(category){
  const input = document.getElementById('input-' + category);
  const val = input.value.trim();
  if(!val) return;

  input.disabled = true;
  try{
    const row = await remoteAdd(category, val);
    data[category].push({ id: row.id, content: row.content });
    input.value = '';
    document.getElementById('form-' + category).classList.remove('open');
    render(category);
    showToast('已添加并同步');
  }catch(err){
    console.error(err);
    showToast('添加失败，请检查网络', true);
  }finally{
    input.disabled = false;
  }
}

async function deleteItem(category, id){
  if(!confirm('确定要删除这条记录吗？')) return;
  try{
    await remoteDelete(id);
    data[category] = data[category].filter(it => it.id !== id);
    render(category);
    showToast('已删除');
  }catch(err){
    console.error(err);
    showToast('删除失败，请检查网络', true);
  }
}

function startEdit(category, id){
  const textEl = document.getElementById(`text-${category}-${id}`);
  const item = data[category].find(it => it.id === id);
  if(!item) return;

  textEl.outerHTML = `
    <div>
      <textarea class="edit-input" id="edit-${category}-${id}">${escapeHtml(item.content)}</textarea>
      <div class="edit-confirm">
        <button class="save-btn" onclick="confirmEdit('${category}', ${id})">保存</button>
        <button class="cancel-btn" onclick="render('${category}')">取消</button>
      </div>
    </div>
  `;
  document.getElementById(`edit-${category}-${id}`).focus();
}

async function confirmEdit(category, id){
  const newVal = document.getElementById(`edit-${category}-${id}`).value.trim();
  if(!newVal){ render(category); return; }
  try{
    await remoteUpdate(id, newVal);
    const item = data[category].find(it => it.id === id);
    if(item) item.content = newVal;
    render(category);
    showToast('已保存');
  }catch(err){
    console.error(err);
    showToast('保存失败，请检查网络', true);
    render(category);
  }
}

/* ============ 初始加载 ============ */
// fetchAll 由解锁后触发，锁屏状态下不加载数据

// 每次切回这个页面/标签时自动刷新一次，保证看到其他设备的最新修改
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    fetchAll();
  }
});
</script>
</body>
